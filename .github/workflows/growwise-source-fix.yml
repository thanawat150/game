name: Apply GrowWise Source Fixes

on:
  push:
    branches:
      - "agent/growwise-playable-phase1"
    paths:
      - "GrowWise/tools/apply_fixes.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply targeted source fixes
        run: python3 GrowWise/tools/apply_fixes.py
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "GrowWise Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add GrowWise
          git commit -m "Apply targeted GrowWise source fixes"
          git push origin HEAD:${{ github.ref_name }}
