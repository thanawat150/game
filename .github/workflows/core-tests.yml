name: Phase 1 Core Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

jobs:
  expand-phase-bundle:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/phases-2-7-simulation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Expand source bundle when present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .phase_bundle/chunk00 ]; then
            echo "Phase bundle is already expanded."
            exit 0
          fi
          cat .phase_bundle/chunk{00..06} > /tmp/phase_bundle.b64
          base64 --decode /tmp/phase_bundle.b64 > /tmp/phase_bundle.zip
          unzip -t /tmp/phase_bundle.zip
          unzip -o /tmp/phase_bundle.zip -d "$GITHUB_WORKSPACE"
          rm -rf .phase_bundle
          rm -f .github/workflows/apply-phase-bundle.yml
          git show origin/main:.github/workflows/core-tests.yml > .github/workflows/core-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement phases 2-7 living world simulation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/WorldForge.Core.Tests/WorldForge.Core.Tests.csproj

      - name: Test deterministic simulation core
        run: dotnet test tests/WorldForge.Core.Tests/WorldForge.Core.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
